name: Release

# Push a tag like v0.1.0 to release both packages. The `release` environment requires a reviewer
# (set in the repository settings). Publishing uses trusted publishing (OIDC): no npm or PyPI token is stored.
on:
  push:
    tags: ["v*"]

jobs:
  npm:
    name: Publish @kargoplex/sdk
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Staged publishing through trusted publishing (OIDC) needs npm 11.15.0 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Stage only: the version goes live after a maintainer approves it on npmjs.com with 2FA
      # (Staged Packages tab, or `npm stage approve <stage-id>`). The trusted publisher allows nothing else.
      - run: npm stage publish --provenance --access public

  pypi:
    name: Publish kargoplex
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - run: pytest
        working-directory: python
        env:
          PYTHONPATH: .
      - run: python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
