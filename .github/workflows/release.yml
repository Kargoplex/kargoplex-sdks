name: Release

# Push a tag like v0.1.0 to release both packages. The `release` environment requires a reviewer
# (set in the repository settings). Publishing uses trusted publishing (OIDC): no npm or PyPI token is stored.
on:
  push:
    tags: ["v*"]

jobs:
  npm:
    name: Publish @kargoplex/sdk
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public

  pypi:
    name: Publish kargoplex
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - run: pytest
        working-directory: python
        env:
          PYTHONPATH: .
      - run: python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
